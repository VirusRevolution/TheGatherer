server {
# https://www.xjavascript.com/blog/building-svelte-app-as-a-set-of-static-files/#step-5-set-up-nginx
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root /frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
